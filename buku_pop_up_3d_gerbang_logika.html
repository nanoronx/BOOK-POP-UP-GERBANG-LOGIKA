<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Ajar Interaktif: Buku Pop-Up 3D Gerbang Logika</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js untuk efek suara interaktif (halaman & saklar) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Google Fonts: Cinzel (judul klasik), Inter (teks jelas), JetBrains Mono (biner & tabel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            tealbook: '#124e5d',
            tealdark: '#0a333d',
            parchment: '#f4e7cf',
            parchmentDark: '#e3cfa9',
            brass: '#c89b4b',
            brassLight: '#f0d593',
          },
        },
      },
    };
  </script>

  <style>
    /* ===== BASE & CINEMATIC VINTAGE DESK AMBIANCE ===== */
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 38% 34%, #3d2c20 0%, #221710 56%, #120c08 100%);
      color: #f8f3e8;
      overflow-x: hidden;
    }

    /* Tekstur meja kayu hangat + soft cinematic spotlight */
    .desk-surface {
      background-image:
        radial-gradient(ellipse at 50% 42%, rgba(235, 192, 118, 0.17) 0%, rgba(20, 12, 8, 0) 62%),
        radial-gradient(circle at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.014) 0px,
          rgba(255, 255, 255, 0.014) 2px,
          transparent 2px,
          transparent 18px
        );
    }

    /* ===== FIXED CINEMATIC 3D STAGE (THREE-QUARTER VIEW) ===== */
    .stage-3d {
      perspective: 2100px;
      perspective-origin: 50% 44%;
      touch-action: none;
      user-select: none;
    }

    .book-rig {
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .book-rig.dragging {
      transition: none;
    }

    /* ===== UNIFIED PHYSICAL 3D POP-UP BOOK ASSEMBLY ===== */
    /* Ukuran konsisten antara kondisi tertutup & terbuka agar tidak ada zoom mendadak */
    .book-assembly {
      position: relative;
      width: 780px;
      height: 440px;
      transform-style: preserve-3d;
      transition: transform 1.05s cubic-bezier(0.32, 0.06, 0.22, 1);
      will-change: transform;
    }

    /* Saat tertutup, buku bergeser halus ke tengah meja (sampul berada di sisi kanan engsel) */
    .book-assembly.is-closed {
      transform: translateX(-195px);
    }

    /* Bayangan alas buku di atas meja (ambient occlusion) */
    .book-desk-shadow {
      position: absolute;
      inset: 6px -10px -16px -10px;
      border-radius: 16px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.72) 35%, rgba(0, 0, 0, 0) 78%);
      transform: translateZ(-24px);
      transition: all 1.05s cubic-bezier(0.32, 0.06, 0.22, 1);
      pointer-events: none;
    }

    .book-assembly.is-closed .book-desk-shadow {
      left: 48%;
      right: -12px;
    }

    /* Papan Hardcover Belakang (sisi kanan saat tertutup, penuh saat terbuka) */
    .hardcover-back-right {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: 50%;
      right: -12px;
      background: linear-gradient(135deg, #165565 0%, #0d3a46 65%, #07232b 100%);
      border-radius: 2px 14px 14px 2px;
      border: 1.5px solid #26778a;
      transform: translateZ(-16px);
      box-shadow:
        6px 10px 24px rgba(0, 0, 0, 0.65),
        inset -2px 0 4px rgba(255, 255, 255, 0.14);
    }

    /* Papan Hardcover Kiri (muncul halus menyatu saat sampul terbuka) */
    .hardcover-back-left {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: -12px;
      right: 50%;
      background: linear-gradient(225deg, #165565 0%, #0d3a46 65%, #07232b 100%);
      border-radius: 14px 2px 2px 14px;
      border: 1.5px solid #26778a;
      transform: translateZ(-16px);
      box-shadow:
        -6px 10px 24px rgba(0, 0, 0, 0.65),
        inset 2px 0 4px rgba(255, 255, 255, 0.14);
      transition: opacity 0.45s ease;
    }

    .book-assembly.is-closed .hardcover-back-left {
      opacity: 0;
      pointer-events: none;
    }

    /* Punggung Buku (Spine) 3D di tengah */
    .book-spine {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: calc(50% - 9px);
      width: 18px;
      background: linear-gradient(90deg, #07222a 0%, #175464 45%, #0b2f38 100%);
      border-radius: 4px;
      transform: translateZ(-13px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
    }

    /* Tumpukan Kertas Tebal Berlapis (Ketebalan Kertas Realistis) */
    .paper-block-left,
    .paper-block-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      transform: translateZ(1px);
      transition: opacity 0.35s ease 0.25s, transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .paper-block-left {
      left: 0;
      border-radius: 6px 2px 2px 6px;
      background: #efe1c6;
      box-shadow:
        -3px 3px 0 #dfd0b0,
        -6px 6px 0 #cfbc97,
        -9px 9px 0 #bba57d,
        -12px 12px 18px rgba(0, 0, 0, 0.45);
    }

    .book-assembly.is-closed .paper-block-left {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease 0.45s;
    }

    .paper-block-right {
      right: 0;
      border-radius: 2px 6px 6px 2px;
      background: #efe1c6;
      box-shadow:
        3px 3px 0 #dfd0b0,
        6px 6px 0 #cfbc97,
        9px 9px 0 #bba57d,
        12px 12px 18px rgba(0, 0, 0, 0.45);
    }

    /* ===== HINGED FRONT HARDCOVER (BUKA & TUTUP REALISTIS) ===== */
    .hardcover-front {
      position: absolute;
      top: -10px;
      bottom: -10px;
      left: 50%;
      width: calc(50% + 12px);
      transform-origin: left center;
      transform-style: preserve-3d;
      transform: translateZ(12px) rotateY(0deg);
      transition: transform 1.05s cubic-bezier(0.32, 0.06, 0.22, 1);
      z-index: 40;
      cursor: pointer;
    }

    /* Saat terbuka penuh, sampul depan berada di belakang halaman kiri (Z = -14px) agar tidak menutupi konten */
    .hardcover-front.is-open {
      transform: translateZ(-14px) rotateY(-180deg);
      pointer-events: none;
    }

    .cover-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 4px 14px 14px 4px;
      overflow: hidden;
    }

    .cover-face-front {
      background: #124e5d;
      border: 2px solid #2b7f92;
      box-shadow:
        inset 16px 0 22px rgba(0, 0, 0, 0.48),
        inset -2px 0 6px rgba(255, 255, 255, 0.18),
        4px 6px 0 #d8c59e,
        7px 9px 18px rgba(0, 0, 0, 0.6);
    }

    .cover-face-inside {
      transform: rotateY(180deg);
      border-radius: 14px 4px 4px 14px;
      background: linear-gradient(135deg, #e7d6b5 0%, #f5ead4 55%, #d9c49c 100%);
      border: 6px solid #104553;
      box-shadow: inset -14px 0 22px rgba(45, 28, 12, 0.3);
    }

    /* ===== PERMUKAAN HALAMAN KERTAS MATTE & SPINE AMBIENT OCCLUSION ===== */
    .page-surface {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #f3e6cc;
      transform-style: preserve-3d;
    }

    .page-surface-left {
      border-radius: 6px 0 0 6px;
    }

    .page-surface-right {
      border-radius: 0 6px 6px 0;
    }

    /* Tekstur kertas matte halus */
    .paper-matte-overlay {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(84, 58, 28, 0.05) 1px, transparent 0),
        linear-gradient(180deg, rgba(255, 250, 240, 0.08) 0%, rgba(25, 16, 8, 0.08) 100%);
      background-size: 6px 6px, 100% 100%;
      pointer-events: none;
    }

    /* Ambient occlusion lipatan tengah buku (realistis seperti buku fisik terbuka) */
    .spine-ao-left {
      position: absolute;
      inset: 0 0 0 auto;
      width: 46px;
      background: linear-gradient(90deg, rgba(35, 20, 8, 0) 0%, rgba(35, 20, 8, 0.16) 60%, rgba(20, 10, 4, 0.42) 100%);
      pointer-events: none;
    }

    .spine-ao-right {
      position: absolute;
      inset: 0 auto 0 0;
      width: 46px;
      background: linear-gradient(270deg, rgba(35, 20, 8, 0) 0%, rgba(35, 20, 8, 0.16) 60%, rgba(20, 10, 4, 0.42) 100%);
      pointer-events: none;
    }

    /* ===== REALISTIC DOUBLE-SIDED CURVED PAGE FLIPPING LEAF ===== */
    .turning-leaf-stage {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 55;
    }

    .turning-leaf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .turning-leaf.turn-next {
      left: 50%;
      transform-origin: left center;
      animation: paperTurnNext 0.92s cubic-bezier(0.42, 0.04, 0.28, 0.98) forwards;
    }

    .turning-leaf.turn-prev {
      left: 0;
      transform-origin: right center;
      animation: paperTurnPrev 0.92s cubic-bezier(0.42, 0.04, 0.28, 0.98) forwards;
    }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #f3e6cc;
      /* Ketebalan tepi kertas saat berputar */
      box-shadow: inset 0 0 0 1.5px rgba(215, 195, 158, 0.85);
    }

    .leaf-face-front {
      border-radius: 0 6px 6px 0;
    }

    .leaf-face-back {
      transform: rotateY(180deg);
      border-radius: 6px 0 0 6px;
    }

    .turn-prev .leaf-face-front {
      border-radius: 6px 0 0 6px;
    }

    .turn-prev .leaf-face-back {
      border-radius: 0 6px 6px 0;
    }

    /* Efek lengkungan cahaya & bayangan pada lembaran kertas yang sedang dibalik */
    .leaf-curl-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0%, rgba(255, 250, 238, 0.22) 35%, rgba(0, 0, 0, 0.08) 70%, rgba(0, 0, 0, 0.22) 100%);
      animation: curlSheenShift 0.92s ease-in-out forwards;
    }

    /* Bayangan dinamis halaman yang menyapu permukaan buku di bawahnya */
    .turning-cast-shadow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform: translateZ(3px);
    }

    .turning-cast-shadow.shadow-next {
      animation: castShadowNext 0.92s cubic-bezier(0.42, 0.04, 0.28, 0.98) forwards;
    }

    .turning-cast-shadow.shadow-prev {
      animation: castShadowPrev 0.92s cubic-bezier(0.42, 0.04, 0.28, 0.98) forwards;
    }

    @keyframes paperTurnNext {
      0% {
        transform: translateZ(6px) rotateY(0deg) skewY(0deg);
      }
      28% {
        transform: translateZ(18px) rotateY(-46deg) skewY(-2.4deg);
      }
      50% {
        transform: translateZ(26px) rotateY(-90deg) skewY(-3.2deg);
      }
      76% {
        transform: translateZ(16px) rotateY(-142deg) skewY(-1.8deg);
      }
      100% {
        transform: translateZ(6px) rotateY(-180deg) skewY(0deg);
      }
    }

    @keyframes paperTurnPrev {
      0% {
        transform: translateZ(6px) rotateY(0deg) skewY(0deg);
      }
      28% {
        transform: translateZ(18px) rotateY(46deg) skewY(2.4deg);
      }
      50% {
        transform: translateZ(26px) rotateY(90deg) skewY(3.2deg);
      }
      76% {
        transform: translateZ(16px) rotateY(142deg) skewY(1.8deg);
      }
      100% {
        transform: translateZ(6px) rotateY(180deg) skewY(0deg);
      }
    }

    @keyframes curlSheenShift {
      0%   { opacity: 0.1; }
      45%  { opacity: 0.92; }
      100% { opacity: 0.12; }
    }

    @keyframes castShadowNext {
      0%   { background: linear-gradient(90deg, transparent 50%, rgba(15, 8, 2, 0.06) 100%); }
      45%  { background: linear-gradient(90deg, rgba(15, 8, 2, 0.02) 15%, rgba(15, 8, 2, 0.44) 50%, rgba(15, 8, 2, 0.18) 85%); }
      100% { background: linear-gradient(90deg, rgba(15, 8, 2, 0.04) 0%, transparent 50%); }
    }

    @keyframes castShadowPrev {
      0%   { background: linear-gradient(270deg, transparent 50%, rgba(15, 8, 2, 0.06) 100%); }
      45%  { background: linear-gradient(270deg, rgba(15, 8, 2, 0.02) 15%, rgba(15, 8, 2, 0.44) 50%, rgba(15, 8, 2, 0.18) 85%); }
      100% { background: linear-gradient(270deg, rgba(15, 8, 2, 0.04) 0%, transparent 50%); }
    }

    /* ===== 3D POP-UP PAPER CRAFT UNFOLDING MECHANISM (LAYERED CUTOUTS) ===== */
    .popup-stage {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 25;
    }

    /* Setiap lapisan pop-up melipat dari garis engsel bawah (folding paper mechanism) */
    .popup-tier {
      transform-style: preserve-3d;
      transform-origin: bottom center;
      will-change: transform, opacity;
    }

    .popup-stage.is-folded * {
      pointer-events: none !important;
    }

    /* Kondisi terbuka: berdiri tegak berlapis dengan sedikit efek elastis (subtle bounce) */
    .popup-stage.is-unfolded .popup-tier-1 {
      transform: translateZ(18px) rotateX(-14deg);
      opacity: 1;
      transition:
        transform 0.68s cubic-bezier(0.22, 1.18, 0.36, 1) 0.04s,
        opacity 0.28s ease 0.02s;
    }

    .popup-stage.is-unfolded .popup-tier-2 {
      transform: translateZ(38px) rotateX(-12deg);
      opacity: 1;
      transition:
        transform 0.72s cubic-bezier(0.22, 1.2, 0.36, 1) 0.16s,
        opacity 0.28s ease 0.12s;
    }

    .popup-stage.is-unfolded .popup-tier-3 {
      transform: translateZ(56px) rotateX(-10deg);
      opacity: 1;
      transition:
        transform 0.72s cubic-bezier(0.22, 1.22, 0.36, 1) 0.28s,
        opacity 0.28s ease 0.22s;
    }

    /* Kondisi melipat: setiap elemen turun & melipat masuk ke permukaan kertas secara bertahap (urutan balik) */
    .popup-stage.is-folded .popup-tier-3 {
      transform: translateZ(1px) rotateX(88deg);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.38s cubic-bezier(0.55, 0.05, 0.75, 0.25) 0s,
        opacity 0.16s ease 0.24s;
    }

    .popup-stage.is-folded .popup-tier-2 {
      transform: translateZ(1px) rotateX(88deg);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.42s cubic-bezier(0.55, 0.05, 0.75, 0.25) 0.08s,
        opacity 0.16s ease 0.34s;
    }

    .popup-stage.is-folded .popup-tier-1 {
      transform: translateZ(1px) rotateX(88deg);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.44s cubic-bezier(0.55, 0.05, 0.75, 0.25) 0.14s,
        opacity 0.16s ease 0.42s;
    }

    /* Bayangan dinamis di atas kertas yang menyusut saat objek pop-up melipat */
    .popup-ground-shadow {
      position: absolute;
      inset: 14% 7% 8% 7%;
      border-radius: 14px;
      background: radial-gradient(ellipse at 50% 65%, rgba(24, 14, 5, 0.42) 0%, rgba(24, 14, 5, 0.16) 52%, transparent 78%);
      transform: translateZ(2px);
      transition: opacity 0.45s ease, transform 0.55s ease;
      pointer-events: none;
    }

    .popup-stage.is-folded .popup-ground-shadow {
      opacity: 0;
      transform: translateZ(1px) scaleY(0.25);
    }

    /* Gaya kartu kertas tebal berlapis (Layered Paper Cutout) */
    .papercraft-card {
      border: 2px solid #e9d9b8;
      box-shadow:
        0 2px 0 #cdb88f,
        0 4px 0 #b59e72,
        0 14px 26px rgba(15, 8, 2, 0.52);
    }

    .papercraft-banner {
      background: linear-gradient(180deg, #faf1dd 0%, #ebd9b4 100%);
      color: #2c1e12;
      border: 2px solid #c5a875;
      box-shadow:
        0 3px 0 #b3925c,
        0 12px 20px rgba(20, 10, 4, 0.42);
    }

    /* Saklar mekanik 3D di dalam buku */
    .mech-switch {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mech-switch:active {
      transform: scale(0.94);
    }

    /* Custom Scrollbar untuk Panel Kanan */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.25);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(200, 155, 75, 0.45);
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(200, 155, 75, 0.75);
    }

    /* Animasi gelombang suara saat narator berbicara */
    @keyframes voiceWave {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1); }
    }
    .voice-bar {
      width: 3px;
      height: 14px;
      border-radius: 999px;
      background: #f0d593;
      transform-origin: bottom center;
      animation: voiceWave 0.75s ease-in-out infinite;
    }
    .voice-bar:nth-child(2) { animation-delay: 0.15s; }
    .voice-bar:nth-child(3) { animation-delay: 0.3s; }
    .voice-bar:nth-child(4) { animation-delay: 0.45s; }
    .voice-bars-idle .voice-bar {
      animation: none;
      transform: scaleY(0.3);
      opacity: 0.45;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col lg:h-screen lg:overflow-hidden">
  <!-- ===== TOP HEADER BAR ===== -->
  <header class="flex-none bg-[#0d2730]/95 border-b border-brass/30 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 z-30 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brassLight to-brass flex items-center justify-center shadow-inner text-[#12303a] font-display font-black text-lg">
        GL
      </div>
      <div>
        <h1 class="font-display font-bold text-sm sm:text-base tracking-wide text-brassLight leading-tight">
          BUKU POP-UP 3D: GERBANG LOGIKA
        </h1>
        <p class="text-[11px] text-teal-200/80">
          Media Ajar Interaktif &bull; Simulasi Rangkaian &amp; Tabel Kebenaran
        </p>
      </div>
    </div>

    <!-- Kontrol Kamera, Overlay & Suara -->
    <div class="flex items-center gap-2 flex-wrap">
      <div class="hidden sm:flex items-center bg-[#081c23] rounded-lg p-1 border border-teal-800/70 text-xs">
        <button onclick="setCameraPreset('iso')" id="cam-iso" class="px-2.5 py-1 rounded-md bg-brass text-[#102930] font-semibold transition">
          3D Sinematik
        </button>
        <button onclick="setCameraPreset('front')" id="cam-front" class="px-2.5 py-1 rounded-md text-teal-100 hover:bg-teal-900/60 transition">
          Horizontal
        </button>
        <button onclick="setCameraPreset('top')" id="cam-top" class="px-2.5 py-1 rounded-md text-teal-100 hover:bg-teal-900/60 transition">
          Atas
        </button>
      </div>

      <button onclick="toggleBookControls()" id="btn-overlay" class="px-3 py-1.5 rounded-lg bg-[#081c23] border border-teal-800/70 text-xs text-teal-100 hover:border-brass/60 flex items-center gap-1.5 transition" title="Tampilkan/Sembunyikan tombol interaktif di atas gambar">
        <span id="overlay-icon">🎛️</span>
        <span class="hidden sm:inline" id="overlay-label">Kontrol 3D: Aktif</span>
      </button>

      <button onclick="toggleSound()" id="btn-sound" class="px-3 py-1.5 rounded-lg bg-[#081c23] border border-teal-800/70 text-xs text-teal-100 hover:border-brass/60 flex items-center gap-1.5 transition" title="Aktifkan/Matikan Efek Suara">
        <span id="sound-icon">🔊</span>
        <span class="hidden sm:inline" id="sound-label">Suara Aktif</span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN WORKSPACE: KIRI = PANGGUNG 3D, KANAN = PANEL PENJELASAN ===== -->
  <main class="flex-1 flex flex-col lg:flex-row min-h-0 overflow-hidden">

    <!-- ===== KOLOM KIRI: PANGGUNG BUKU POP-UP 3D ===== -->
    <section class="relative flex-1 desk-surface flex flex-col justify-between min-h-[520px] lg:min-h-0 overflow-hidden">

      <!-- Petunjuk interaksi 3D mengambang di pojok kiri atas -->
      <div class="absolute top-3 left-3 z-20 flex items-center gap-2 bg-black/45 backdrop-blur-md border border-brass/30 px-3 py-1.5 rounded-full text-[11px] text-amber-100/90 pointer-events-none">
        <span>🖱️ Geser layar untuk putar sudut 3D</span>
        <span class="hidden md:inline text-brass/80">&bull;</span>
        <span class="hidden md:inline">Klik saklar 0/1 di buku!</span>
      </div>

    // Fungsi perhitungan logika biner untuk ke-7 gerbang
    function calcGate(gate, a, b) {
      const A = a ? 1 : 0;
      const B = b ? 1 : 0;
      switch (gate) {
        case 'AND':  return (A && B) ? 1 : 0;
        case 'OR':   return (A || B) ? 1 : 0;
        case 'NOT':  return A ? 0 : 1;
        case 'NAND': return (A && B) ? 0 : 1;
        case 'NOR':  return (A || B) ? 0 : 1;
        case 'XOR':  return (A !== B) ? 1 : 0;
        case 'XNOR': return (A === B) ? 1 : 0;
        default:     return 0;
      }
    }

    // =========================================================================
    // 2. EFEK SUARA INTERAKTIF (TONE.JS - TANPA URL EKSTERNAL)
    // =========================================================================

    function ensureAudio() {
      if (!state.soundEnabled || typeof Tone === 'undefined') return false;
      try {
        if (Tone.context && Tone.context.state !== 'running') {
          Tone.start();
        }
        state.audioReady = true;
        return true;
      } catch (_) {
        return false;
      }
    }

    function playSwitchSound(isOn) {
      if (!ensureAudio()) return;
      try {
        const synth = new Tone.Synth({
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.005, decay: 0.08, sustain: 0.01, release: 0.08 },
          volume: -14,
        }).toDestination();
        synth.triggerAttackRelease(isOn ? 'E5' : 'A4', '32n');
        setTimeout(() => synth.dispose(), 250);
      } catch (_) {}
    }

    function playPageFlipSound() {
      if (!ensureAudio()) return;
      try {
        const noise = new Tone.NoiseSynth({
          noise: { type: 'pink' },
          envelope: { attack: 0.04, decay: 0.22, sustain: 0, release: 0.1 },
          volume: -18,
        }).toDestination();
        noise.triggerAttackRelease('8n');
        setTimeout(() => noise.dispose(), 400);
      } catch (_) {}
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');
      if (icon) icon.textContent = state.soundEnabled ? '🔊' : '🔇';
      if (label) label.textContent = state.soundEnabled ? 'Suara Aktif' : 'Suara Mati';
      if (state.soundEnabled) playSwitchSound(true);

    // =========================================================================
    // 2B. VOICE SPEECH BAHASA INDONESIA (KARAKTER SUARA PRIA MUDA)
    // =========================================================================

    function pickYoungMaleIndonesianVoice() {
      if (!state.speech.supported) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return;

      // Filter suara berbahasa Indonesia (id-ID / id_ID / bahasa indonesia)
      const idVoices = voices.filter((v) =>
        /^id([-_]|$)/i.test(v.lang) || /indones/i.test(v.name)
      );

      // Prioritaskan suara pria muda Indonesia (mis. Microsoft Ardi, Andika, Male/Pria)
      const maleHints = /(ardi|andika|bagus|budi|male|pria|laki|man|boy)/i;
      const femaleHints = /(gadis|damayanti|siti|putri|female|wanita|perempuan|woman)/i;

      let chosen = idVoices.find((v) => maleHints.test(v.name));
      if (chosen) {
        state.speech.voiceObj = chosen;
        state.speech.isNativeMale = true;
      } else {
        // Jika tidak ada label pria eksplisit, pilih suara Indonesia non-wanita terlebih dahulu, lalu fallback ke suara Indonesia pertama
        chosen = idVoices.find((v) => !femaleHints.test(v.name)) || idVoices[0] || null;
        state.speech.voiceObj = chosen;
        state.speech.isNativeMale = false;
      }

      updateVoiceBarUI();
    }

    function initSpeechVoices() {
      if (!state.speech.supported) {
        updateVoiceBarUI();
        return;
      }
      pickYoungMaleIndonesianVoice();
      if (typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
        window.speechSynthesis.onvoiceschanged = pickYoungMaleIndonesianVoice;
      }
    }

    function speakText(text, label = '') {
      if (!state.speech.supported || !text) return;
      try {
        window.speechSynthesis.cancel();

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'id-ID';

        if (!state.speech.voiceObj) {
          pickYoungMaleIndonesianVoice();
        }
        if (state.speech.voiceObj) {
          utter.voice = state.speech.voiceObj;
        }

        // Karakter suara pria muda: artikulasi tegas, tempo segar & natural
        if (state.speech.isNativeMale) {
          utter.pitch = 1.02;
          utter.rate = 1.02;
        } else {
          // Penyesuaian nada agar terdengar seperti pria muda saat browser hanya menyediakan suara standar
          utter.pitch = 0.84;
          utter.rate = 1.01;
        }
        utter.volume = 1.0;

        utter.onstart = () => {
          state.speech.isSpeaking = true;
          state.speech.isPaused = false;
          updateVoiceBarUI(label || `Sedang membacakan Halaman ${state.currentPage}...`);
        };

        utter.onpause = () => {
          state.speech.isPaused = true;
          updateVoiceBarUI('Narasi dijeda');
        };

        utter.onresume = () => {
          state.speech.isPaused = false;
          updateVoiceBarUI(label || `Melanjutkan Halaman ${state.currentPage}...`);
        };

        utter.onend = () => {
          state.speech.isSpeaking = false;
          state.speech.isPaused = false;
          updateVoiceBarUI('Selesai membacakan materi');
        };

        utter.onerror = () => {
          state.speech.isSpeaking = false;
          state.speech.isPaused = false;
          updateVoiceBarUI('Siap membacakan materi halaman ini');
        };

        window.speechSynthesis.speak(utter);
      } catch (err) {
        console.warn('Voice speech tidak dapat dijalankan:', err);
      }
    }

    function speakCurrentPage(isAuto = false) {
      if (!state.speech.supported) return;
      if (isAuto && (!state.speech.autoPlay || state.rightTab !== 'materi')) return;

      const script = PAGE_NARRATIONS[state.currentPage] || PAGE_NARRATIONS[0];
      const pageLabel = state.currentPage === 0
        ? 'Membacakan Sampul Buku...'
        : `Membacakan Materi Halaman ${state.currentPage}...`;
      speakText(script, pageLabel);
    }

    function speakGateDetail(gateKey) {
      const info = GATE_INFO[gateKey];
      if (!info) return;
      const script = `${info.name}, termasuk kategori ${info.category}. ${info.rule} Sebagai analogi, ${info.analogy}`;
      speakText(script, `Membacakan ${info.name}...`);
    }

    function togglePlayPauseSpeech() {
      if (!state.speech.supported) return;
      if (state.speech.isSpeaking && !state.speech.isPaused) {
        window.speechSynthesis.pause();
        state.speech.isPaused = true;
        updateVoiceBarUI('Narasi dijeda');
      } else if (state.speech.isSpeaking && state.speech.isPaused) {
        window.speechSynthesis.resume();
        state.speech.isPaused = false;
        updateVoiceBarUI(`Melanjutkan Halaman ${state.currentPage}...`);
      } else {
        speakCurrentPage(false);
      }
    }

    function stopSpeech() {
      if (!state.speech.supported) return;
      try {
        window.speechSynthesis.cancel();
      } catch (_) {}
      state.speech.isSpeaking = false;
      state.speech.isPaused = false;
      updateVoiceBarUI('Siap membacakan materi halaman ini');
    }

    function toggleAutoSpeech() {
      state.speech.autoPlay = !state.speech.autoPlay;
      playSwitchSound(state.speech.autoPlay);
      updateVoiceBarUI();
      if (state.speech.autoPlay && !state.speech.isSpeaking && state.rightTab === 'materi') {
        speakCurrentPage(true);
      }
    }

    function updateVoiceBarUI(customStatus = null) {
      const bars = document.getElementById('voice-bars');
      const statusEl = document.getElementById('voice-status-text');
      const playIcon = document.getElementById('voice-play-icon');
      const playLabel = document.getElementById('voice-play-label');
      const autoBtn = document.getElementById('btn-voice-auto');
      const autoDot = document.getElementById('voice-auto-dot');
      const autoLabel = document.getElementById('voice-auto-label');

      if (!state.speech.supported) {
        if (statusEl) statusEl.textContent = 'Browser ini belum mendukung fitur Voice Speech';
        return;
      }

      const activeTalking = state.speech.isSpeaking && !state.speech.isPaused;
      if (bars) {
        bars.classList.toggle('voice-bars-idle', !activeTalking);
      }

      if (playIcon && playLabel) {
        if (activeTalking) {
          playIcon.textContent = '⏸';
          playLabel.textContent = 'Jeda Narasi';
        } else if (state.speech.isPaused) {
          playIcon.textContent = '▶';
          playLabel.textContent = 'Lanjutkan';
        } else {
          playIcon.textContent = '▶';
          playLabel.textContent = 'Bacakan Halaman';
        }
      }

      if (autoBtn && autoDot && autoLabel) {
        if (state.speech.autoPlay) {
          autoBtn.className = 'flex-none px-2.5 py-1 rounded-lg text-[10px] font-bold border transition flex items-center gap-1 bg-emerald-500/20 border-emerald-400/50 text-emerald-200';
          autoDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse';
          autoLabel.textContent = 'Otomatis: Aktif';
        } else {
          autoBtn.className = 'flex-none px-2.5 py-1 rounded-lg text-[10px] font-semibold border transition flex items-center gap-1 bg-slate-800/80 border-slate-600/70 text-slate-300';
          autoDot.className = 'w-1.5 h-1.5 rounded-full bg-slate-400';
          autoLabel.textContent = 'Otomatis: Manual';
        }
      }

      if (statusEl && customStatus !== null) {
        statusEl.textContent = customStatus;
      } else if (statusEl && !state.speech.isSpeaking) {
        const pageName = state.currentPage === 0 ? 'Sampul Buku' : `Halaman ${state.currentPage}`;
        statusEl.textContent = `Siap membacakan materi ${pageName}`;
      }
    }

    // =========================================================================
    // 3. NAVIGASI HALAMAN CINEMATIC 3D POP-UP (BUKA, TUTUP, BALIK HALAMAN)
    // =========================================================================

    function updateNavigationUI(pageIdx) {
      const pageTitles = [
        'Sampul (0 / 4)',
        'Hal. 1 / 4 — Peta Konsep',
        'Hal. 2 / 4 — AND, OR, NOT',
        'Hal. 3 / 4 — NAND, NOR',
        'Hal. 4 / 4 — XOR, XNOR',
      ];
      document.getElementById('page-indicator').textContent = pageTitles[pageIdx];
      document.getElementById('btn-prev').disabled = pageIdx === 0;
      document.getElementById('btn-next').disabled = pageIdx === 4;

      document.querySelectorAll('.chapter-pill').forEach((btn) => {
        const bp = Number(btn.dataset.page);
        if (bp === pageIdx) {
          btn.className = 'chapter-pill px-3 py-1.5 rounded-lg text-xs font-bold bg-brass text-[#0f242c] shadow transition';
        } else {
          btn.className = 'chapter-pill px-3 py-1.5 rounded-lg text-xs font-semibold bg-[#182930] text-teal-100/80 hover:bg-[#233c46] transition';
        }
      });
    }

    function goToPage(targetPage) {
      const clamped = Math.max(0, Math.min(4, targetPage));
      if (clamped === state.currentPage || state.isTransitioning) return;

      // Hentikan narasi halaman sebelumnya dengan bersih sebelum transisi
      stopSpeech();

      const fromPage = state.currentPage;
      state.isTransitioning = true;

      const assembly = document.getElementById('book-assembly');
      const frontCover = document.getElementById('hardcover-front');
      const coverCta = document.getElementById('cover-cta-wrap');
      const popupStage = document.getElementById('popup-stage');
      const turningStage = document.getElementById('turning-leaf-stage');

      // ----- KASUS 1: MEMBUKA BUKU DARI SAMPUL (0 -> 1..4) -----
      if (fromPage === 0 && clamped > 0) {
        state.currentPage = clamped;
        state.renderedSpread = clamped;
        updateNavigationUI(clamped);
        renderRightPanel();
        playPageFlipSound();

        // Pasang ilustrasi halaman tujuan dalam kondisi datar terlipat sebelum sampul terbuka
        setSpreadArtworks(clamped, clamped);
        updatePopupLayerContent(false);
        if (coverCta) {
          coverCta.style.opacity = '0';
          coverCta.classList.add('pointer-events-none');
        }

        // Mulai animasi sampul terbuka perlahan + buku bergeser mulus ke posisi terbuka
        requestAnimationFrame(() => {
          if (assembly) assembly.classList.remove('is-closed');
          if (frontCover) frontCover.classList.add('is-open');
        });

        // Setelah halaman terbuka, elemen 3D Pop-Up mulai muncul & berdiri bertahap
        setTimeout(() => {
          if (popupStage) {
            popupStage.classList.remove('is-folded');
            popupStage.classList.add('is-unfolded');
          }
          playSwitchSound(true);
          // Mulai narasi otomatis saat halaman selesai terbuka
          speakCurrentPage(true);
        }, 820);

        setTimeout(() => {
          state.isTransitioning = false;
        }, 1520);
        return;
      }

      // ----- KASUS 2: MENUTUP BUKU KEMBALI KE SAMPUL (1..4 -> 0) -----
      if (fromPage > 0 && clamped === 0) {
        // Fase 1: Lipat perlahan semua objek 3D Pop-Up kembali ke permukaan kertas
        if (popupStage) {
          popupStage.classList.remove('is-unfolded');
          popupStage.classList.add('is-folded');
        }
        playSwitchSound(false);

        // Fase 2: Setelah pop-up benar-benar terlipat, tutup sampul hardcover perlahan
        setTimeout(() => {
          state.currentPage = 0;
          updateNavigationUI(0);
          renderRightPanel();
          playPageFlipSound();

          if (frontCover) frontCover.classList.remove('is-open');
          if (assembly) assembly.classList.add('is-closed');
        }, 540);

        setTimeout(() => {
          if (coverCta) {
            coverCta.style.opacity = '1';
            coverCta.classList.remove('pointer-events-none');
          }
          state.isTransitioning = false;
          updateVoiceBarUI();
        }, 1620);
        return;
      }

      // ----- KASUS 3: PERGANTIAN HALAMAN (1..4 <-> 1..4) -----
      const isNext = clamped > fromPage;

      // Fase 1: Lipat objek 3D Pop-Up halaman saat ini kembali datar ke permukaan kertas
      if (popupStage) {
        popupStage.classList.remove('is-unfolded');
        popupStage.classList.add('is-folded');
      }
      playSwitchSound(false);

      // Fase 2: Angkat & balik lembaran kertas dua sisi dengan lengkungan + bayangan dinamis
      setTimeout(() => {
        playPageFlipSound();

        // Di bawah lembaran yang dibalik, sisi yang terungkap sudah menampilkan halaman tujuan
        if (isNext) {
          setSpreadArtworks(fromPage, clamped);
        } else {
          setSpreadArtworks(clamped, fromPage);
        }

        // Bangun lembaran kertas dua sisi yang melengkung saat berputar
        if (turningStage) {
          const frontImg = isNext ? GITHUB_IMAGES[fromPage] : GITHUB_IMAGES[fromPage];
          const backImg = isNext ? GITHUB_IMAGES[clamped] : GITHUB_IMAGES[clamped];
          const frontPos = isNext ? '-left-full' : 'left-0';
          const backPos = isNext ? 'left-0' : '-left-full';

          turningStage.innerHTML = `
            <div class="turning-cast-shadow ${isNext ? 'shadow-next' : 'shadow-prev'}"></div>
            <div class="turning-leaf ${isNext ? 'turn-next' : 'turn-prev'}">
              <div class="leaf-face leaf-face-front">
                <img src="${frontImg}" alt="Halaman dibalik" class="absolute top-0 ${frontPos} w-[200%] h-full max-w-none object-cover select-none pointer-events-none" />
                <div class="paper-matte-overlay"></div>
                <div class="${isNext ? 'spine-ao-right' : 'spine-ao-left'}"></div>
                <div class="leaf-curl-sheen"></div>
              </div>
              <div class="leaf-face leaf-face-back">
                <img src="${backImg}" alt="Halaman baru" class="absolute top-0 ${backPos} w-[200%] h-full max-w-none object-cover select-none pointer-events-none" />
                <div class="paper-matte-overlay"></div>
                <div class="${isNext ? 'spine-ao-left' : 'spine-ao-right'}"></div>
                <div class="leaf-curl-sheen"></div>
              </div>
            </div>
          `;
        }
      }, 520);

      // Fase 3: Setelah lembaran mendarat lembut, pasang halaman baru & munculkan Pop-Up 3D bertahap
      setTimeout(() => {
        state.currentPage = clamped;
        state.renderedSpread = clamped;
        setSpreadArtworks(clamped, clamped);
        if (turningStage) turningStage.innerHTML = '';

        updateNavigationUI(clamped);
        renderRightPanel();
        updatePopupLayerContent(false);

        requestAnimationFrame(() => {
          setTimeout(() => {
            if (popupStage) {
              popupStage.classList.remove('is-folded');
              popupStage.classList.add('is-unfolded');
            }
            playSwitchSound(true);
            // Mulai narasi otomatis untuk halaman baru yang dipilih
            speakCurrentPage(true);
          }, 40);
        });
      }, 1440);

      setTimeout(() => {
        state.isTransitioning = false;
      }, 2120);
    }

    function nextPage() {
      goToPage(state.currentPage + 1);
    }

    function prevPage() {
      goToPage(state.currentPage - 1);
    }

    function selectOverviewGate(gateName) {
      if (!GATE_INFO[gateName]) return;
      state.inputs.selectedOverviewGate = gateName;
      playSwitchSound(true);
      updatePopupLayerContent(true);
      renderRightPanel();
    }

    function toggleInput(key) {
      if (!(key in state.inputs)) return;
      state.inputs[key] = state.inputs[key] ? 0 : 1;
      playSwitchSound(Boolean(state.inputs[key]));
      updatePopupLayerContent(true);
      renderRightPanel();
    }

    function setRightTab(tab) {
      state.rightTab = tab;
      const tabMateri = document.getElementById('tab-materi');
      const tabKuis = document.getElementById('tab-kuis');

      if (tab === 'materi') {
        tabMateri.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold bg-brass text-[#0d2229] shadow transition flex items-center justify-center gap-1.5';
        tabKuis.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold text-teal-200 hover:bg-teal-900/50 transition flex items-center justify-center gap-1.5';
      } else {
        stopSpeech();
        tabKuis.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold bg-brass text-[#0d2229] shadow transition flex items-center justify-center gap-1.5';
        tabMateri.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-semibold text-teal-200 hover:bg-teal-900/50 transition flex items-center justify-center gap-1.5';
      }

      playSwitchSound(true);
      renderRightPanel();
    }

    // =========================================================================
    // 4. KONTROL KAMERA 3D & DRAG GESTURE (FIXED CINEMATIC CAMERA)
    // =========================================================================

    function setCameraPreset(preset) {
      state.camera.preset = preset;
      if (preset === 'iso') {
        state.camera.rotX = 16;
        state.camera.rotY = 0;
      } else if (preset === 'front') {
        state.camera.rotX = 0;
        state.camera.rotY = 0;
      } else if (preset === 'top') {
        state.camera.rotX = 34;
        state.camera.rotY = 0;
      }

      ['iso', 'front', 'top'].forEach((id) => {
        const el = document.getElementById(`cam-${id}`);
        if (!el) return;
        el.className =
          id === preset
            ? 'px-2.5 py-1 rounded-md bg-brass text-[#102930] font-semibold transition'
            : 'px-2.5 py-1 rounded-md text-teal-100 hover:bg-teal-900/60 transition';
      });

      updateBookTransform();
    }

    function updateBookTransform() {
      const rig = document.getElementById('book-rig');
      if (!rig) return;
      // Kamera tetap stabil & konsisten di seluruh transisi (tanpa lonjakan perspektif)
      rig.style.transform = `rotateX(${state.camera.rotX}deg) rotateY(${state.camera.rotY}deg)`;
    }

    function setupDragCamera() {
      const stage = document.getElementById('stage-3d');
      const rig = document.getElementById('book-rig');
      if (!stage || !rig) return;

      let dragging = false;
      let startX = 0;
      let startY = 0;
      let baseRotX = 0;
      let baseRotY = 0;

      const onStart = (clientX, clientY, target) => {
        if (target && target.closest('button')) return;
        dragging = true;
        startX = clientX;
        startY = clientY;
        baseRotX = state.camera.rotX;
        baseRotY = state.camera.rotY;
        rig.classList.add('dragging');
      };

      const onMove = (clientX, clientY) => {
        if (!dragging) return;
        const dx = clientX - startX;
        const dy = clientY - startY;
        state.camera.rotY = Math.max(-32, Math.min(32, baseRotY + dx * 0.22));
        state.camera.rotX = Math.max(0, Math.min(48, baseRotX - dy * 0.22));
        updateBookTransform();
      };

      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        rig.classList.remove('dragging');
      };

      // Mouse events
      stage.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY, e.target));
      window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', onEnd);

      // Touch events
      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
        }
      }, { passive: true });
      stage.addEventListener('touchmove', (e) => {
        if (dragging && e.touches.length === 1) {
          onMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });
      stage.addEventListener('touchend', onEnd);
      stage.addEventListener('touchcancel', onEnd);
    }

    // =========================================================================

    function setSpreadArtworks(leftPageIdx, rightPageIdx) {
      const leftImg = document.getElementById('page-img-left');
      const rightImg = document.getElementById('page-img-right');
      if (leftImg && GITHUB_IMAGES[leftPageIdx]) leftImg.src = GITHUB_IMAGES[leftPageIdx];
      if (rightImg && GITHUB_IMAGES[rightPageIdx]) rightImg.src = GITHUB_IMAGES[rightPageIdx];
    }

    function updatePopupLayerContent(keepUnfolded = true) {
      const popupStage = document.getElementById('popup-stage');
      if (!popupStage) return;

      const p = state.renderedSpread;
      let content = '<div class="popup-ground-shadow"></div>';

      if (state.showBookControls) {
        if (p === 1) content += buildSpread1_Overview();
        if (p === 2) content += buildSpread2_AndOrNot();
        if (p === 3) content += buildSpread3_NandNor();
        if (p === 4) content += buildSpread4_XorXnor();
      }

      popupStage.innerHTML = content;

      if (keepUnfolded && state.currentPage > 0) {
        popupStage.classList.remove('is-folded');
        popupStage.classList.add('is-unfolded');
      }
    }

    // -------------------------------------------------------------------------
    // SPREAD 1: LAYERED 3D PAPER CUTOUT — "gerbang logik & tabel kebenaran.jfif"
    // -------------------------------------------------------------------------
    function buildSpread1_Overview() {
      const sel = state.inputs.selectedOverviewGate;
      const pins = [
        { g: 'AND',  pos: 'left-[22%] top-[41%]' },
        { g: 'OR',   pos: 'left-[22%] top-[55%]' },
        { g: 'NOT',  pos: 'left-[21%] top-[70%]' },
        { g: 'XOR',  pos: 'left-[48%] top-[39%]' },
        { g: 'XNOR', pos: 'left-[48%] top-[60%]' },
        { g: 'NAND', pos: 'left-[74%] top-[41%]' },
        { g: 'NOR',  pos: 'left-[74%] top-[57%]' },
      ];

      return `
        <!-- Tier 1: Papan Judul Paper Cutout Timbul -->
        <div class="popup-tier popup-tier-1 absolute top-3 inset-x-0 flex justify-center pointer-events-none">
          <div class="papercraft-banner rounded-lg px-5 py-1 text-center">
            <span class="font-display font-extrabold text-xs tracking-wider uppercase">Peta Konsep 7 Gerbang Logika</span>
          </div>
        </div>

        <!-- Tier 2: Pin Paper-Craft 7 Gerbang Logika -->
        <div class="popup-tier popup-tier-2 absolute inset-0 pointer-events-none">
          ${pins.map(({ g, pos }) => `
            <button onclick="event.stopPropagation(); selectOverviewGate('${g}')"
              class="papercraft-card pointer-events-auto absolute ${pos} -translate-x-1/2 -translate-y-1/2 px-2.5 py-1 rounded-full font-mono text-[11px] font-bold transition cursor-pointer ${
                sel === g
                  ? 'bg-amber-400 text-[#231404] scale-110'
                  : 'bg-[#0f242c]/92 text-amber-100 hover:bg-brass hover:text-[#0f242c]'
              }">
              ${g}
            </button>
          `).join('')}
        </div>

        <!-- Tier 3: Panel Informasi Lipatan Depan -->

    function buildTruthTableHTML(gateKey, activeA = null, activeB = null) {
      const info = GATE_INFO[gateKey];
      if (info.unary) {
        const rows = [0, 1];
        return `
          <table class="w-full text-center font-mono text-xs rounded-lg overflow-hidden border border-teal-800/80">
            <thead class="bg-[#09181f] text-brassLight">
              <tr>
                <th class="py-1.5 border-b border-teal-800/80">Input A</th>
                <th class="py-1.5 border-b border-teal-800/80">Output Y</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((a) => {
                const y = calcGate('NOT', a, 0);
                const isActive = activeA === a;
                return `
                  <tr class="${isActive ? 'bg-amber-400/20 text-amber-200 font-bold' : 'bg-[#0d2028]/70 text-teal-100/90'} border-b border-teal-900/60">
                    <td class="py-1.5">${a}</td>
                    <td class="py-1.5 ${y ? 'text-emerald-300 font-bold' : 'text-slate-400'}">${y}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      const combos = [
        [0, 0],
        [0, 1],
        [1, 0],
        [1, 1],
      ];

      return `
        <table class="w-full text-center font-mono text-xs rounded-lg overflow-hidden border border-teal-800/80">
          <thead class="bg-[#09181f] text-brassLight">
            <tr>
              <th class="py-1.5 border-b border-teal-800/80">A</th>
              <th class="py-1.5 border-b border-teal-800/80">B</th>
              <th class="py-1.5 border-b border-teal-800/80">Output Y</th>
            </tr>
          </thead>
          <tbody>
            ${combos.map(([a, b]) => {
              const y = calcGate(gateKey, a, b);
              const isActive = activeA === a && activeB === b;
              return `
                <tr class="${isActive ? 'bg-amber-400/20 text-amber-200 font-bold' : 'bg-[#0d2028]/70 text-teal-100/90'} border-b border-teal-900/60">
                  <td class="py-1.5">${a}</td>
                  <td class="py-1.5">${b}</td>
                  <td class="py-1.5 ${y ? 'text-emerald-300 font-bold' : 'text-slate-400'}">${y}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    function buildInteractiveGateCard(gateKey, keyA, keyB = null) {
      const info = GATE_INFO[gateKey];
      const valA = state.inputs[keyA];
      const valB = keyB ? state.inputs[keyB] : 0;

      return `

              <button onclick="toggleInput('${keyA}')"
                class="px-3 py-1.5 rounded-lg font-mono text-xs font-bold border transition ${
                  valA ? 'bg-emerald-500 border-emerald-200 text-slate-950' : 'bg-slate-800 border-slate-600 text-slate-200'
                }">
                A = ${valA}
              </button>
              ${keyB ? `
                <button onclick="toggleInput('${keyB}')"
                  class="px-3 py-1.5 rounded-lg font-mono text-xs font-bold border transition ${
                    valB ? 'bg-emerald-500 border-emerald-200 text-slate-950' : 'bg-slate-800 border-slate-600 text-slate-200'
                  }">
                  B = ${valB}

              <span class="px-3 py-1 rounded-lg font-mono text-xs font-black ${
                out ? 'bg-amber-400 text-slate-950 shadow-[0_0_12px_rgba(251,191,36,0.65)]' : 'bg-slate-900 text-slate-400 border border-slate-700'
              }">

          ${buildTruthTableHTML(gateKey, valA, keyB ? valB : null)}

          <div class="bg-[#0e252e] rounded-xl p-2.5 border-l-2 border-brass text-[11px] text-amber-100/85 leading-relaxed">
            <strong class="text-brassLight">💡 Analogi:</strong> ${info.analogy}
          </div>
        </div>
      `;
    }

    // ---- RENDER PANEL KUIS INTERAKTIF ----
    function renderQuizPanel(container) {
      const answeredCount = Object.keys(state.quiz.answers).length;
      let score = 0;
      QUIZ_DATA.forEach((item, idx) => {
        if (state.quiz.answers[idx] === item.correct) score++;
      });

      container.innerHTML = `
        <div class="bg-gradient-to-r from-[#143742] to-[#0a1d24] border border-brass/40 rounded-2xl p-4 flex items-center justify-between gap-3">
          <div>
            <h2 class="font-display font-bold text-base text-brassLight">🎯 Kuis Cepat Gerbang Logika</h2>
            <p class="text-[11px] text-teal-100/80">Terjawab: ${answeredCount} / ${QUIZ_DATA.length} soal</p>
          </div>
          <div class="text-right">
            <div class="font-mono text-lg font-black text-amber-300">${score * 20}</div>
            <div class="text-[10px] text-teal-200/70">Skor (Maks 100)</div>
          </div>
        </div>

        <div class="space-y-3">
          ${QUIZ_DATA.map((item, qIdx) => {
            const chosen = state.quiz.answers[qIdx];
            const hasAnswered = chosen !== undefined;
            const isCorrect = chosen === item.correct;

            return `
              <div class="bg-[#0a1b22] border border-teal-800/80 rounded-2xl p-3.5 space-y-2.5">
                <p class="text-xs font-semibold text-amber-50 leading-relaxed">
                  <span class="text-brassLight font-mono mr-1">${qIdx + 1}.</span>${item.q}
                </p>
                <div class="space-y-1.5">
                  ${item.options.map((opt, oIdx) => {
                    let cls = 'bg-[#122b35] border-teal-800/70 text-teal-100 hover:bg-[#193b48]';
                    if (hasAnswered) {
                      if (oIdx === item.correct) {
                        cls = 'bg-emerald-500/25 border-emerald-400 text-emerald-200 font-bold';
                      } else if (oIdx === chosen) {
                        cls = 'bg-rose-500/25 border-rose-400 text-rose-200 font-bold';
                      } else {
                        cls = 'bg-[#0e2129] border-teal-900/50 text-teal-200/50';
                      }
                    }
                    return `
                      <button onclick="answerQuiz(${qIdx}, ${oIdx})"
                        class="w-full text-left px-3 py-2 rounded-xl text-xs border transition ${cls}">
                        ${opt}
                      </button>
                    `;
                  }).join('')}
                </div>
                ${hasAnswered ? `
                  <div class="text-[11px] rounded-xl p-2.5 border ${
                    isCorrect
                      ? 'bg-emerald-950/50 border-emerald-500/40 text-emerald-200'
                      : 'bg-rose-950/50 border-rose-500/40 text-rose-200'
                  }">
                    <strong>${isCorrect ? '✅ Benar!' : '❌ Kurang tepat.'}</strong> ${item.explain}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <button onclick="resetQuiz()" class="w-full py-2.5 rounded-xl bg-[#163642] hover:bg-[#1f4959] border border-brass/40 text-xs font-bold text-brassLight transition">
          🔄 Ulangi Kuis
        </button>
      `;
    }

    function answerQuiz(qIdx, oIdx) {
      state.quiz.answers[qIdx] = oIdx;
      playSwitchSound(oIdx === QUIZ_DATA[qIdx].correct);
      renderRightPanel();
    }

    function resetQuiz() {
      state.quiz.answers = {};
      playSwitchSound(false);
      renderRightPanel();
    }

    // =========================================================================
    // 7. RESPONSIVE SCALING & INITIALIZATION
    // =========================================================================

    function updateBookScale() {
      const stage = document.getElementById('stage-3d');
      const wrapper = document.getElementById('book-scale-wrapper');
      if (!stage || !wrapper) return;

      // Dimensi acuan tetap konsisten di semua halaman agar tidak ada efek zoom mendadak
      const stageW = stage.clientWidth - 40;
      const stageH = stage.clientHeight - 56;
      const baseW = 820;
      const baseH = 510;

      const scale = Math.min(stageW / baseW, stageH / baseH, 1.05);
      wrapper.style.transform = `scale(${Math.max(scale, 0.36)})`;
    }

    window.addEventListener('resize', updateBookScale);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    window.addEventListener('beforeunload', stopSpeech);

    window.onload = function () {
      // Preload semua gambar halaman GitHub agar transisi halaman langsung tampil utuh
      Object.values(GITHUB_IMAGES).forEach((src) => {
        const img = new Image();
        img.src = src;
      });
      initSpeechVoices();
      setupDragCamera();
      setCameraPreset('iso');
      initPhysicalBookDOM();
      renderRightPanel();
      updateBookScale();
    };
  </script>
</body>
</html>
